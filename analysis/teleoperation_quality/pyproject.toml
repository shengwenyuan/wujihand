[project]
name = "wujihand-teleoperation-quality"
version = "0.2.1"
description = "Read-only offline quality analysis for WujiHand ROS 2 teleoperation runs"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<2.4",
    "pyyaml>=6,<7",
]

[project.scripts]
wujihand-analyze-ros2-run = "teleoperation_quality.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teleoperation_quality"]

[dependency-groups]
dev = [
    "mypy>=1.16,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
