[project]
name = "wujihand-mini-dataset-export"
version = "0.1.0"
description = "Read-only WujiHand q54 tri-view export to a pinned LeRobot v3 dataset"
requires-python = ">=3.12,<3.14"
dependencies = [
    "wujihand",
    "lerobot[dataset] @ git+https://github.com/huggingface/lerobot.git@7e241bd630a3719a56157a497ce5d08f244784f1",
    "numpy>=2.0,<2.3",
    "pillow>=10,<13",
]

[project.scripts]
wujihand-export-mini-dataset = "wujihand_mini_dataset_export.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wujihand_mini_dataset_export"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
wujihand = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.16,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "../../src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "../../src"

[[tool.mypy.overrides]]
module = ["PIL", "lerobot.*"]
ignore_missing_imports = true
