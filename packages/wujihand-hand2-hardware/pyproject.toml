[project]
name = "wujihand-hand2-hardware"
version = "0.4.0"
description = "Fail-closed Wuji Hand2 Beta1 hardware bring-up utilities"
requires-python = ">=3.11,<3.13"
dependencies = [
    "wuji-sdk==2026.8.3",
]

[project.scripts]
wujihand-hand2-hardware = "wujihand_hand2_hardware.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wujihand_hand2_hardware"]

[dependency-groups]
dev = [
    "mypy>=1.16,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
