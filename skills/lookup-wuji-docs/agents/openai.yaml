interface:
  display_name: "Wuji Docs Lookup"
  short_description: "通过官方 MCP 核验舞肌硬件、SDK、仿真与版本资料"
  default_prompt: "Use $lookup-wuji-docs and the wuji-docs MCP to verify current authoritative Wuji documentation before answering or implementing."

dependencies:
  tools:
    - type: "mcp"
      value: "wuji-docs"
      description: "Official Wuji documentation search and page retrieval"
      transport: "streamable_http"
      url: "https://docs.wuji.tech/mcp"
