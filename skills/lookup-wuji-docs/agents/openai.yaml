interface:
  display_name: "Wuji Docs Lookup"
  short_description: "核验舞肌 Beta 硬件、SDK、模型与版本边界"
  default_prompt: "Use $lookup-wuji-docs and the official wuji-docs MCP to verify the current Wuji beta stage and release boundaries before answering or implementing."

dependencies:
  tools:
    - type: "mcp"
      value: "wuji-docs"
      description: "Official Wuji documentation search and page retrieval"
      transport: "streamable_http"
      url: "https://docs.wuji.tech/mcp"
