schema: wujihand.assembly_spec.v1
assembly_id: nero_dual_hand2_d405_wrist_rig_tframe_gripper_flange_candidate_v2026_8_3_v1
instances:
  - instance_id: nero_left
    asset:
      path: configs/assets/agilex_nero_gripper_flange_v1.yaml
      expected_id: agilex_nero_gripper_flange
    role: arm
    namespace: nero_left
  - instance_id: hand_left
    asset:
      path: configs/assets/wuji_hand2_beta1_left_v2026_8_3_v1.yaml
      expected_id: wuji_hand2_beta1_left
    role: end_effector
    namespace: hand2_left
  - instance_id: mount_left
    asset:
      path: configs/assets/nero_hand2_beta1_d405_mount_v2_left.yaml
      expected_id: nero_hand2_beta1_d405_mount_v2_left
    role: mount
    namespace: d405_mount_left
  - instance_id: d405_left
    asset:
      path: configs/assets/realsense_d405_housing_sim_left.yaml
      expected_id: realsense_d405_housing_sim_left
    role: sensor
    namespace: d405_left
  - instance_id: nero_right
    asset:
      path: configs/assets/agilex_nero_gripper_flange_v1.yaml
      expected_id: agilex_nero_gripper_flange
    role: arm
    namespace: nero_right
  - instance_id: hand_right
    asset:
      path: configs/assets/wuji_hand2_beta1_right_v2026_8_3_v1.yaml
      expected_id: wuji_hand2_beta1_right
    role: end_effector
    namespace: hand2_right
  - instance_id: mount_right
    asset:
      path: configs/assets/nero_hand2_beta1_d405_mount_v2_right.yaml
      expected_id: nero_hand2_beta1_d405_mount_v2_right
    role: mount
    namespace: d405_mount_right
  - instance_id: d405_right
    asset:
      path: configs/assets/realsense_d405_housing_sim_right.yaml
      expected_id: realsense_d405_housing_sim_right
    role: sensor
    namespace: d405_right
roots: [nero_left, nero_right]
attachments:
  - attachment_id: nero_left_gripper_flange_to_hand2_left_wrist
    parent: {instance: nero_left, frame: gripper_flange}
    child: {instance: hand_left, frame: hand_base}
    transform:
      position_m: [0.0, 0.0, 0.012]
      quat_wxyz: [0.0, 0.0, 1.0, 0.0]
    assumption: historical_plate_outer_face_contacts_the_vendor_cup_positive_z_rim
  - attachment_id: hand2_left_wrist_to_mount_v2
    parent: {instance: hand_left, frame: hand_base}
    child:
      instance: mount_left
      frame: nero_hand2_beta1_d405_mount_v2_left_hand_interface
    transform:
      position_m: [0.0, 0.0, 0.0]
      quat_wxyz: [0.0, -0.7071067811865476, 0.7071067811865475, 0.0]
    assumption: generated_mount_uses_the_inverse_v2026_8_3_left_wrist_root_orientation_compensation
  - attachment_id: mount_v2_left_to_d405_rear
    parent:
      instance: mount_left
      frame: nero_hand2_beta1_d405_mount_v2_left_camera_interface
    child:
      instance: d405_left
      frame: realsense_d405_housing_sim_left_rear_mount
    transform:
      position_m: [0.0, 0.0, 0.0]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    assumption: generated_d405_visual_origin_is_the_mount_camera_interface_rear_plane
  - attachment_id: nero_right_gripper_flange_to_hand2_right_wrist
    parent: {instance: nero_right, frame: gripper_flange}
    child: {instance: hand_right, frame: hand_base}
    transform:
      position_m: [0.0, 0.0, 0.012]
      quat_wxyz: [0.0, 0.0, 1.0, 0.0]
    assumption: historical_plate_outer_face_contacts_the_vendor_cup_positive_z_rim
  - attachment_id: hand2_right_wrist_to_mount_v2
    parent: {instance: hand_right, frame: hand_base}
    child:
      instance: mount_right
      frame: nero_hand2_beta1_d405_mount_v2_right_hand_interface
    transform:
      position_m: [0.0, 0.0, 0.0]
      quat_wxyz: [0.0, -0.7071067811865476, -0.7071067811865475, 0.0]
    assumption: generated_mount_uses_the_inverse_v2026_8_3_right_wrist_root_orientation_compensation
  - attachment_id: mount_v2_right_to_d405_rear
    parent:
      instance: mount_right
      frame: nero_hand2_beta1_d405_mount_v2_right_camera_interface
    child:
      instance: d405_right
      frame: realsense_d405_housing_sim_right_rear_mount
    transform:
      position_m: [0.0, 0.0, 0.0]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    assumption: generated_d405_visual_origin_is_the_mount_camera_interface_rear_plane
