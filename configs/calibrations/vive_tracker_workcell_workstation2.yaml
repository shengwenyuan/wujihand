schema: wujihand.tracker_workcell_mapping.v1
mapping_id: vive_tracker_workcell_workstation2
tracking_frame: vive_tracking
workcell_frame: world
# Workstation2 inward-port tabletop correction on 2026-07-30:
# operator right = Tracker -Z, table-inward = Tracker -X, up = Tracker +Y.
# The same proper rotation maps translation and relative spatial rotation.
tracker_to_workcell:
  - [0.0, 0.0, -1.0]  # Workcell +X = Tracker -Z
  - [-1.0, 0.0, 0.0]  # Workcell +Y = Tracker -X
  - [0.0, 1.0, 0.0]   # Workcell +Z = Tracker +Y
translation_scale: 1.0
max_translation_delta_m: 0.4
rotation_scale: 1.0
max_rotation_delta_deg: 15.0
relative_rotation_semantics: workcell_spatial_delta
scope: simulation_only
provenance: workstation2_inward_port_tabletop_xy_roll_pitch_correction_2026_07_30
