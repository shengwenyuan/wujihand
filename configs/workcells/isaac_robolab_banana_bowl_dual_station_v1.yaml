schema: wujihand.workcell.v1
workcell_id: isaac_robolab_banana_bowl_dual_station_v1
world_frame: world
frames:
  # RoboLab authors the robot at the origin, facing its main table along +X.
  # Map that anchor to the qualified dual-NERO center and project +Y direction.
  - frame_id: robolab_scene_anchor
    parent: world
    transform:
      position_m: [0.0, -0.52, 0.80]
      quat_wxyz: [0.7071067811865476, 0.0, 0.0, 0.7071067811865475]
  - frame_id: simulation_nominal_table_top
    parent: world
    transform:
      position_m: [0.0, 0.0, 0.80]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  - frame_id: simulation_nominal_camera_oblique_eye
    parent: world
    transform:
      # Shared by the synthetic scene D435i and the ROS GUI initial view.
      # XY is the source RoboLab Franka anchor / midpoint of the two NERO bases.
      position_m: [0.0, -0.52, 1.50]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  - frame_id: simulation_nominal_camera_oblique_target
    parent: world
    transform:
      # Center of the 1.00 m x 0.70 m task tabletop after Workcell alignment;
      # this gives a 51.8-degree downward pitch from the camera eye.
      position_m: [0.0, 0.03, 0.80]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  - frame_id: simulation_nominal_camera_top_eye
    parent: world
    transform:
      position_m: [0.0, -0.10, 2.25]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  - frame_id: simulation_nominal_camera_top_target
    parent: world
    transform:
      position_m: [0.0, -0.05, 0.80]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  - frame_id: simulation_nominal_camera_right_interface_eye
    parent: world
    transform:
      position_m: [0.72, -0.035, 1.25]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  - frame_id: simulation_nominal_camera_right_interface_target
    parent: world
    transform:
      position_m: [0.234, -0.035, 1.174]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
mounts:
  - mount_id: table_near_left
    frame: simulation_nominal_table_top
    transform:
      position_m: [-0.32, -0.52, 0.0]
      quat_wxyz: [0.7071067811865476, 0.0, 0.0, -0.7071067811865475]
  - mount_id: table_near_right
    frame: simulation_nominal_table_top
    transform:
      position_m: [0.32, -0.52, 0.0]
      quat_wxyz: [0.7071067811865476, 0.0, 0.0, -0.7071067811865475]
entities: []
compatibility_profile: configs/profiles/isaac_robolab_banana_bowl_v1.yaml
