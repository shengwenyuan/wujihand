[project]
name = "wujihand"
version = "0.1.0"
description = "MediaPipe-to-Wuji-Hand retargeting, supervision, simulation, and recording"
requires-python = "==3.11.*"
dependencies = [
    # Worker-only ABI selected for current Wuji retargeting/Pinocchio compatibility.
    "numpy>=2.2,<2.3",
    "scipy>=1.15,<1.16",
    "psutil>=7,<8",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
perception = [
    # MediaPipe requires this distribution but leaves its version unconstrained.
    "mediapipe==0.10.35",
    "opencv-contrib-python==4.11.0.86",
    # Match the installed rs-enumerate-devices/librealsense 2.55.1 runtime.
    "pyrealsense2==2.55.1.6486",
]
retarget = [
    # Linux wheel requires glibc >= 2.34; this host provides glibc 2.35.
    "wuji-sdk[retarget]==2026.7.2",
    # 2.7 rejects the Path object used internally by the current Wuji SDK.
    "pin>=3.3,<3.8",
    # Pin 3.7 links against URDFDOM SONAME 4.0; 6.0 is not ABI-compatible.
    "cmeel-urdfdom==4.0.1",
    "cmeel-tinyxml2==10.0.0",
    # 2.7.1 is compiled against NumPy 1.x and fails under the Pinocchio 3 ABI set.
    "nlopt>=2.10,<3",
]
recording = [
    "h5py>=3.13,<4",
]
cli = [
    "rich>=14,<15",
    "typer>=0.16,<1",
]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1.16,<2",
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2,<3",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not requires_socket'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "requires_socket: uses a real local network socket and is excluded from sandboxed fast tests",
    "requires_upstream_asset: checks a restored third-party asset when available",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
