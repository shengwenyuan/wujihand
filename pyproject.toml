[project]
name = "wujihand"
version = "0.1.0"
description = "MediaPipe-to-Wuji-Hand retargeting, supervision, simulation, and recording"
# The core/five-layer runtime also runs inside Isaac Sim 6 / ROS 2 Jazzy Python 3.12.
# Perception and retarget extras retain Python 3.11 as their validated worker baseline.
requires-python = ">=3.11,<3.13"
dependencies = [
    # Worker-only ABI selected for current Wuji retargeting/Pinocchio compatibility.
    "numpy>=2.2,<2.3",
    "scipy>=1.15,<1.16",
    "psutil>=7,<8",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
perception = [
    # MediaPipe requires this distribution but leaves its version unconstrained.
    "mediapipe==0.10.35",
    "opencv-contrib-python==4.11.0.86",
    # Match the installed rs-enumerate-devices/librealsense 2.55.1 runtime.
    "pyrealsense2==2.55.1.6486",
]
retarget = [
    # Native retargeting is bundled in the Linux wheel; no Pinocchio extra is needed.
    # 2026.7.21 also supplies CPython 3.12 wheels for the Isaac 6.0.1 host.
    "wuji-sdk==2026.7.21",
]
recording = [
    "h5py>=3.13,<4",
]
cli = [
    "rich>=14,<15",
    "typer>=0.16,<1",
]
mujoco = [
    # Validated with the pinned FR3 v2 and Wuji Hand 2 MJCF assets.
    "mujoco==3.10.0",
]
tracking = [
    # Python bindings for the SteamVR/OpenVR runtime; the runtime itself is installed separately.
    "openvr==2.12.1401",
]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1.16,<2",
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2,<3",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not requires_socket'"
testpaths = ["tests"]
pythonpath = ["src", "ros2/wujihand_ros2"]
markers = [
    "requires_mujoco: uses the optional MuJoCo runtime and pinned upstream MJCF assets",
    "requires_socket: uses a real local network socket and is excluded from sandboxed fast tests",
    "requires_upstream_asset: checks a restored third-party asset when available",
    "requires_vive: uses the local SteamVR runtime and attached VIVE tracking hardware",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
